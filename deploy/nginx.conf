user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_req_zone $binary_remote_addr zone=familygram:1m rate=5r/s;
    map $http_upgrade $familygram_connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8443 ssl;
        server_name 24projects.ru;
        ssl_certificate /etc/letsencrypt/live/24projects.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/24projects.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        location = /v1/transport {
            proxy_pass http://access:10000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $familygram_connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }
        location = /v1/events {
            proxy_pass http://access:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 90s;
        }
        location ^~ /v1/push/ {
            # Endpoint path is a webhook credential: never log it, including errors.
            access_log off;
            error_log /dev/null;
            client_max_body_size 128;
            proxy_pass http://access:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_read_timeout 10s;
        }
        location / {
            limit_req zone=familygram burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://access:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            proxy_connect_timeout 3s;
        }
    }
}
